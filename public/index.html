<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitHub User Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <svg height="32" viewBox="0 0 16 16" width="32" aria-hidden="true"><path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
    </a>
    <form id="topSearch" class="top-search">
      <input id="keyword" type="search" placeholder="Search users (name, keyword)…" autocomplete="off" />
    </form>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>Filter by</h2>
      <form id="filters">
        <label for="country">Country / location</label>
        <input id="country" list="countries" placeholder="e.g. Germany" required />
        <datalist id="countries"></datalist>

        <label for="language">Language</label>
        <input id="language" placeholder="e.g. JavaScript" />

        <label for="minFollowers">Min followers</label>
        <input id="minFollowers" type="number" min="0" placeholder="0" />

        <label for="minRepos">Min repositories</label>
        <input id="minRepos" type="number" min="0" placeholder="0" />

        <label class="check"><input id="emailOnly" type="checkbox" /> Only users with public email</label>

        <button type="submit" class="btn-primary">Search</button>
      </form>
    </aside>

    <main class="results">
      <div class="results-header">
        <h1 id="count">Search GitHub users by country</h1>
        <button type="button" id="copyAll" class="btn" hidden>Copy emails</button>
        <div class="sort">
          <label for="sort">Sort by:</label>
          <select id="sort">
            <option value="">Best match</option>
            <option value="followers|desc">Most followers</option>
            <option value="followers|asc">Fewest followers</option>
            <option value="repositories|desc">Most repositories</option>
            <option value="joined|desc">Recently joined</option>
            <option value="joined|asc">Least recently joined</option>
          </select>
        </div>
      </div>
      <p id="status" class="status"></p>
      <ul id="list" class="user-list"></ul>
      <nav id="pager" class="pager"></nav>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
